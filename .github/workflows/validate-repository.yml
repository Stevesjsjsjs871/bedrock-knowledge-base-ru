name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository JSON and pack manifests
        run: python tools/validate_repository.py
      - name: Validate the Performance RP entry point
        run: python tools/validate_performance_rp.py
