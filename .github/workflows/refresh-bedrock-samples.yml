name: Refresh Mojang Bedrock Samples release index

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"
  push:
    paths:
      - "tools/sync_bedrock_samples_releases.py"
      - ".github/workflows/refresh-bedrock-samples.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release index transformation
        run: python -m unittest discover -s tests -p 'test_bedrock_samples_catalog.py' -v
      - name: Refresh official release index
        run: python tools/sync_bedrock_samples_releases.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bedrock_samples_releases.json docs/ru/справочник/КАТАЛОГ_BEDROCK_SAMPLES_ПО_ВЕРСИЯМ.md
          git diff --cached --quiet || git commit -m "Refresh Mojang Bedrock Samples release index"
          git pull --rebase origin main
          git push
