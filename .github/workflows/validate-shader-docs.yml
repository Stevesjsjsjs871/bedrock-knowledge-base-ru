name: Validate shader documentation

on:
  push:
    paths:
      - "README.md"
      - "docs/ru/шейдеры/**"
      - "tests/test_shader_docs.py"
      - ".github/workflows/validate-shader-docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/ru/шейдеры/**"
      - "tests/test_shader_docs.py"
      - ".github/workflows/validate-shader-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shader documentation
        run: python -m unittest discover -s tests -v
