name: Refresh source catalog

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/refresh-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Sync upstream repositories
        run: python tools/sync_sources.py
      - name: Build catalog
        run: python tools/build_catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ru/КАТАЛОГ_СТАТЕЙ.md docs/ru/ПОВТОРЫ_И_СВЯЗИ.md
          git diff --cached --quiet || git commit -m "Refresh source catalog"
          # Another writer may update main between the rebase and push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push catalog after three attempts." >&2
          exit 1
